# kind cluster config for local development -- not applied by install-argocd.sh,
# run manually first: `kind create cluster --config bootstrap/kind-config.yaml`
#
# extraPortMappings + the ingress-ready node label are kind's own documented
# setup for running ingress-nginx locally (see install-ingress-nginx.sh):
# https://kind.sigs.k8s.io/docs/user/ingress/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
