apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Layers on top of overlays/dev rather than duplicating its resource sizing --
# the only thing local/kind needs on top of dev is the image tag override
# below, so `kind load docker-image app:local` (no registry) is what actually
# runs. A non-`latest` tag also means Kubernetes defaults to
# imagePullPolicy: IfNotPresent instead of Always, so kubelet doesn't try to
# pull `app:local` from a real registry.
resources:
  - ../dev

images:
  - name: app
    newName: app
    newTag: local
