apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Swaps the ALB-specific class + annotations for ingress-nginx, installed
# locally by bootstrap/install-ingress-nginx.sh.
resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: grafana
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx
      - op: replace
        path: /metadata/annotations
        value: {}
