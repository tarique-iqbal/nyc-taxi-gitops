apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# clickhouse has no per-cloud-environment variation (single-node everywhere --
# see CLAUDE.md), so base/ has no dev/staging/prod siblings, only this one
# local overlay. Only the schema-apply Job's image needs a local-only
# override; the StatefulSet's own clickhouse/clickhouse-server:24.4 image is
# a real public image either way.
resources:
  - ../../base

images:
  - name: app
    newName: app
    newTag: local
