apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes:
    - Ingress
  ingress:
    # consumer + health-server, native protocol (see
    # docs/kubernetes/README.md's DNS reference table).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: etl
      ports:
        - protocol: TCP
          port: 9000
    # schema-apply Job, same namespace -- applies migrations on startup.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: schema-apply
      ports:
        - protocol: TCP
          port: 9000
    # Grafana's ClickHouse datasource (native protocol).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9000
    # Prometheus scraping ClickHouse's built-in exporter.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9363
  # No Egress policyType -- clickhouse itself never initiates outbound
  # connections, so it needs no explicit egress rules (including no DNS
  # rule; unlike every other file in this plan, there's nothing here to
  # resolve). Leaving Egress out of policyTypes means this policy doesn't
  # restrict egress at all -- the namespace-level default-deny-all
  # backstop (step 8) is what will eventually cover that, and clickhouse
  # doesn't need it to.
  #
  # No ingress rule opens port 8123 (http) to any peer -- nothing in the
  # traffic map needs it (consumer/health-server/schema-apply/grafana all
  # use the native port 9000; prometheus uses the metrics port 9363). The
  # StatefulSet's own startupProbe/livenessProbe/readinessProbe all hit
  # `http`, so this relies on the same kubelet-probe-exemption caveat as
  # health-server/base/network-policy.yaml -- if anything ever needs
  # http-protocol access to ClickHouse, add an explicit rule here rather
  # than assuming the exemption is enough.
