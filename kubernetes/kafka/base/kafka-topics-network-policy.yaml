apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-topics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka-topics
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
    # DNS -- self-contained, see producer/base/network-policy.yaml's comment
    # for why this isn't left to the shared namespace-level baseline alone.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
