apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-server
  labels:
    app.kubernetes.io/name: health-server
    app.kubernetes.io/part-of: nyc-taxi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-server
    spec:
      serviceAccountName: health-server
      containers:
        - name: health-server
          image: app:latest
          command: ["python", "-m", "etl.entrypoints.health_server"]
          envFrom:
            - configMapRef:
                name: health-server
            - secretRef:
                name: health-server
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
