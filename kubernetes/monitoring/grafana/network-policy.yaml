apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public-facing by design (the Grafana Ingress has no host/auth gate
    # of its own -- see kubernetes/ingress/). AWS's ALB (target-type: ip)
    # routes to this pod's IP directly, bypassing the Service/kube-proxy
    # path, so its source can't be expressed as a namespaceSelector/
    # podSelector the way every other rule in this repo's policies is --
    # an ipBlock is the only option. Same rule also covers kind's
    # ingress-nginx path, so no kind-specific carve-out is needed.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clickhouse
          podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 9000
    # DNS -- self-contained, see producer/base/network-policy.yaml's comment
    # for why this isn't left to the shared namespace-level baseline alone.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
