apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Grafana's Prometheus datasource, same namespace.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Scrape targets -- see docs/kubernetes/README.md's DNS reference
    # table. No producer target: a one-shot Job has nothing to scrape
    # continuously.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: etl
          podSelector:
            matchLabels:
              app.kubernetes.io/name: consumer
      ports:
        - protocol: TCP
          port: 9101
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clickhouse
          podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 9363
    # DNS -- self-contained, see producer/base/network-policy.yaml's comment
    # for why this isn't left to the shared namespace-level baseline alone.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
