# Points at overlays/local (not kubernetes/kafka/base, which the AWS
# Application uses) because kafka's own broker image is a Kustomize
# `images:` placeholder (kafka:latest) rewritten to a real registry image by
# CI -- same local-only image-tag concern as producer/consumer/health-server.
# See kubernetes/kafka/overlays/local/kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nyc-taxi-kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nyc-taxi

  source:
    repoURL: "https://github.com/tarique-iqbal/nyc-taxi-gitops.git"
    targetRevision: main
    path: kubernetes/kafka/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
