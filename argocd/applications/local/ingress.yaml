# Points at overlays/local (ingressClassName: nginx, no ALB annotations)
# instead of the flat kubernetes/ingress the AWS Application uses. No
# aws-load-balancer-controller counterpart exists in this directory -- see
# bootstrap/install-ingress-nginx.sh, which installs ingress-nginx as a
# plain static manifest outside Argo CD instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nyc-taxi-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nyc-taxi

  source:
    repoURL: "https://github.com/tarique-iqbal/nyc-taxi-gitops.git"
    targetRevision: main
    path: kubernetes/ingress/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
