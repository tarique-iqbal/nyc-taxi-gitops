# Points at overlays/local (not the flat kubernetes/clickhouse the AWS
# Application uses) only because the schema-apply Job runs the `app` image --
# see kubernetes/clickhouse/overlays/local/kustomization.yaml. ClickHouse's
# own StatefulSet image is unaffected either way.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nyc-taxi-clickhouse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nyc-taxi

  source:
    repoURL: "https://github.com/tarique-iqbal/nyc-taxi-gitops.git"
    targetRevision: main
    path: kubernetes/clickhouse/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: clickhouse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
