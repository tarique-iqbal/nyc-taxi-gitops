apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nyc-taxi-clickhouse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nyc-taxi

  source:
    repoURL: "https://github.com/tarique-iqbal/nyc-taxi-gitops.git"
    targetRevision: main
    path: kubernetes/clickhouse

  destination:
    server: https://kubernetes.default.svc
    namespace: clickhouse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
